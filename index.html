<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101218"><title>Mesa VTT — Entrada</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#25223b,#101218 65%);color:#f4f1ff;font:16px system-ui;display:grid;place-items:center;padding:20px}main{width:min(100%,560px)}.panel{background:#191a25;border:1px solid #37364a;border-radius:18px;padding:26px;box-shadow:0 18px 60px #0008}h1{margin:0 0 6px;font-size:28px}p{color:#b9b5c9;line-height:1.5}.muted{font-size:13px;color:#928da5}label{display:block;margin:16px 0 7px;color:#d8d3e8;font-size:14px}input{width:100%;padding:13px;border:1px solid #49465e;border-radius:10px;background:#10111a;color:#fff;font:inherit}button{border:0;border-radius:10px;padding:12px 16px;background:#8d72e8;color:white;font-weight:700;font-size:15px;cursor:pointer}button.secondary{background:#353348}button.danger{background:#793d50}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.actions button{flex:1}.hidden{display:none!important}.status{margin-top:16px;padding:12px;border-radius:10px;background:#252437;color:#d8d1f6;white-space:pre-wrap}.item{padding:12px;margin:8px 0;border:1px solid #3c394f;border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}.item small{display:block;color:#a9a4b8}.code{font:700 24px ui-monospace;letter-spacing:3px;color:#c7b6ff}.choice{min-height:76px;font-size:17px}
</style>
</head>
<body><main>
<section class="panel" id="entry">
<h1>⚔ Mesa VTT</h1><p>Digite seu nick e escolha como deseja entrar.</p>
<label for="username">Seu nick</label><input id="username" maxlength="24" placeholder="Ex.: Aventureiro123" autocomplete="nickname">
<div class="actions"><button class="choice" id="showCreate">＋ Criar sala</button><button class="secondary choice" id="showJoin">↗ Entrar na sala</button></div>
<div id="entryStatus" class="status hidden"></div>
<div id="createForm" class="hidden"><label for="roomName">Nome da sala</label><input id="roomName" maxlength="60" placeholder="Minha campanha"><div class="actions"><button id="create">Criar sala e gerar código</button><button class="secondary" id="backCreate">Voltar</button></div></div>
<div id="joinForm" class="hidden"><label for="roomCode">Código de convite</label><input id="roomCode" maxlength="8" placeholder="Ex.: AB12CD34" style="text-transform:uppercase"><div class="actions"><button id="join">Solicitar entrada</button><button class="secondary" id="backJoin">Voltar</button></div></div>
</section>
<section class="panel hidden" id="lobby">
<h1 id="hello">Bem-vindo</h1><p>Compartilhe o código abaixo com os jogadores. Eles precisarão da sua aprovação para entrar.</p>
<div id="lobbyStatus" class="status"></div>
<div id="masterArea" class="hidden"><h3>Solicitações de entrada</h3><div id="requests"></div><h3>Jogadores na sala</h3><div id="members"></div><div class="actions"><button class="secondary" id="toggleEntry">Fechar entrada</button><button id="enterMaster">Entrar no VTT</button></div></div>
<div id="waitingArea" class="hidden"><h3>Aguardando aprovação do Mestre…</h3><p>Esta página avisará quando sua entrada for autorizada.</p></div><div class="actions"><button id="enterPlayer" class="hidden">Entrar no VTT</button></div>
</section></main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const SUPABASE_URL='https://dffaohrfdpzneaxrskka.supabase.co';
const SUPABASE_KEY='sb_publishable_dezPrTyFioS7xTRPG4fFhA_tiIJDZwE';
const sb=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let user=null,activeRoom=null,isMaster=false,entryOpen=true,watcher=null;
function showStatus(id,msg){$(id).textContent=msg;$(id).classList.remove('hidden')}
function hideStatus(id){$(id).classList.add('hidden')}
function showMode(mode){$('createForm').classList.toggle('hidden',mode!=='create');$('joinForm').classList.toggle('hidden',mode!=='join');hideStatus('entryStatus')}
async function prepareUser(){
 const name=$('username').value.trim();
 if(name.length<2||name.length>24)throw new Error('Digite um nick entre 2 e 24 caracteres.');
 let {data:{session}}=await sb.auth.getSession();
 if(!session){const {data,error}=await sb.auth.signInAnonymously();if(error)throw new Error('Não foi possível iniciar sessão anônima. Verifique se ela está habilitada no Supabase: '+error.message);session=data.session;}
 user=session.user;
 const {error}=await sb.rpc('set_my_username',{p_username:name});if(error)throw error;
 $('hello').textContent='Olá, '+name;
}
async function loadVTT(){
 const s=document.createElement('div');s.style.cssText='position:fixed;inset:0;background:#101218;color:white;display:grid;place-items:center;z-index:99999;font:16px system-ui';s.textContent='Carregando sua mesa…';document.body.append(s);
 try{const response=await fetch('https://raw.githubusercontent.com/guifmartins1992-hub/mesa-vtt/main/mesa-vtt-v4.html.gz.b64',{cache:'no-store'});if(!response.ok)throw new Error('Falha ao baixar o VTT ('+response.status+')');const encoded=(await response.text()).replace(/\s/g,'');const binary=atob(encoded);const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close();}catch(e){s.textContent='Erro ao abrir o VTT: '+e.message;}
}
async function refreshMaster(){
 if(!activeRoom||!isMaster)return;
 const {data:req,error}=await sb.from('join_requests').select('id,user_id,created_at').eq('room_id',activeRoom.id).eq('status','pending').order('created_at');
 if(error){showStatus('lobbyStatus',error.message);return}
 const {data:mem}=await sb.from('room_members').select('user_id,role').eq('room_id',activeRoom.id);
 const ids=[...(req||[]).map(x=>x.user_id),...(mem||[]).map(x=>x.user_id)];
 const {data:profiles}=ids.length?await sb.from('profiles').select('user_id,username').in('user_id',[...new Set(ids)]):{data:[]};
 const name=id=>profiles?.find(p=>p.user_id===id)?.username||'Jogador';
 $('requests').innerHTML='';
 for(const r of req||[]){const el=document.createElement('div');el.className='item';const info=document.createElement('span');info.textContent=name(r.user_id);const acts=document.createElement('span');for(const [txt,ok,cls] of [['Aprovar',true,''],['Recusar',false,'danger']]){const b=document.createElement('button');b.textContent=txt;b.className=cls;b.onclick=async()=>{b.disabled=true;const {error}=await sb.rpc('review_room_request',{p_request_id:r.id,p_approve:ok});if(error)alert(error.message);await refreshMaster()};acts.append(b)}el.append(info,acts);$('requests').append(el)}
 $('members').innerHTML='';
 for(const m of mem||[]){const el=document.createElement('div');el.className='item';const info=document.createElement('span');info.textContent=name(m.user_id)+' — '+m.role;el.append(info);if(m.role==='player'){const b=document.createElement('button');b.className='danger';b.textContent='Remover';b.onclick=async()=>{if(confirm('Remover '+name(m.user_id)+'?')){const {error}=await sb.rpc('remove_room_member',{p_room_id:activeRoom.id,p_user_id:m.user_id});if(error)alert(error.message);await refreshMaster()}};el.append(b)}$('members').append(el)}
}
async function startMaster(room){
 activeRoom=room;isMaster=true;$('entry').classList.add('hidden');$('lobby').classList.remove('hidden');$('masterArea').classList.remove('hidden');$('waitingArea').classList.add('hidden');
 $('lobbyStatus').innerHTML='Código de convite da sala:<br><span class="code"></span><br>Envie esse código aos jogadores.';$('lobbyStatus').querySelector('.code').textContent=room.code;
 await refreshMaster();if(watcher)sb.removeChannel(watcher);
 watcher=sb.channel('master-'+room.id).on('postgres_changes',{event:'*',schema:'public',table:'join_requests',filter:'room_id=eq.'+room.id},refreshMaster).on('postgres_changes',{event:'*',schema:'public',table:'room_members',filter:'room_id=eq.'+room.id},refreshMaster).subscribe();
}
async function waitForApproval(roomId){
 activeRoom={id:roomId};isMaster=false;$('entry').classList.add('hidden');$('lobby').classList.remove('hidden');$('waitingArea').classList.remove('hidden');$('masterArea').classList.add('hidden');showStatus('lobbyStatus','Pedido enviado. Aguarde o Mestre aprovar sua entrada.');
 if(watcher)sb.removeChannel(watcher);
 watcher=sb.channel('wait-'+roomId).on('postgres_changes',{event:'INSERT',schema:'public',table:'room_members',filter:'room_id=eq.'+roomId},async payload=>{if(payload.new.user_id===user.id){showStatus('lobbyStatus','Entrada aprovada!');$('waitingArea').classList.add('hidden');$('enterPlayer').classList.remove('hidden')}}).subscribe();
 const {data:existing}=await sb.from('room_members').select('role').eq('room_id',roomId).eq('user_id',user.id).maybeSingle();
 if(existing){$('waitingArea').classList.add('hidden');$('enterPlayer').classList.remove('hidden')}
}
$('showCreate').onclick=()=>showMode('create');$('showJoin').onclick=()=>showMode('join');$('backCreate').onclick=()=>showMode('');$('backJoin').onclick=()=>showMode('');
$('create').onclick=async()=>{$('create').disabled=true;try{await prepareUser();const {data,error}=await sb.rpc('create_room',{p_name:$('roomName').value.trim()||'Minha mesa'});if(error)throw error;const row=Array.isArray(data)?data[0]:data;await startMaster({id:row.room_id,code:row.room_code});}catch(e){showStatus('entryStatus',e.message||String(e))}finally{$('create').disabled=false}};
$('join').onclick=async()=>{$('join').disabled=true;try{await prepareUser();const code=$('roomCode').value.trim().toUpperCase();if(!code)throw new Error('Digite o código de convite.');const {data,error}=await sb.rpc('request_room_access',{p_code:code});if(error)throw error;const {data:room}=await sb.from('rooms').select('id,name').eq('code',code).maybeSingle();if(!room)throw new Error('Não foi possível localizar a sala. Confira o código.');await waitForApproval(room.id,data);}catch(e){showStatus('entryStatus',e.message||String(e))}finally{$('join').disabled=false}};
$('toggleEntry').onclick=async()=>{const {error}=await sb.rpc('set_room_entry',{p_room_id:activeRoom.id,p_open:!entryOpen});if(error){alert(error.message);return}entryOpen=!entryOpen;$('toggleEntry').textContent=entryOpen?'Fechar entrada':'Reabrir entrada'};
$('enterMaster').onclick=loadVTT;$('enterPlayer').onclick=loadVTT;
</script></body></html>
