<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101218"><title>Mesa VTT</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#25223b,#101218 65%);color:#f4f1ff;font:16px system-ui;display:grid;place-items:center;padding:20px}main{width:min(100%,560px)}.panel{background:#191a25;border:1px solid #37364a;border-radius:18px;padding:26px;box-shadow:0 18px 60px #0008}h1{margin:0 0 6px;font-size:28px}h2{margin:18px 0 6px}p{color:#b9b5c9;line-height:1.5}label{display:block;margin:16px 0 7px;color:#d8d3e8;font-size:14px}input{width:100%;padding:13px;border:1px solid #49465e;border-radius:10px;background:#10111a;color:#fff;font:inherit}button{border:0;border-radius:10px;padding:13px 16px;background:#8d72e8;color:white;font-weight:700;font-size:15px;cursor:pointer}button.secondary{background:#353348}button.danger{background:#793d50}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.actions button{flex:1}.rolebtn{min-height:104px;font-size:19px}.hidden{display:none!important}.status{margin-top:16px;padding:12px;border-radius:10px;background:#252437;color:#d8d1f6;white-space:pre-wrap}.item{padding:12px;margin:8px 0;border:1px solid #3c394f;border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}.code{font:700 26px ui-monospace;letter-spacing:3px;color:#c7b6ff;display:inline-block;margin:8px 0}
</style></head><body><main>
<section class="panel" id="roles"><h1>⚔ Mesa VTT</h1><p>Como deseja acessar a mesa?</p><div class="actions"><button class="rolebtn" id="asMaster">♛ Mestre</button><button class="secondary rolebtn" id="asPlayer">⚔ Jogador</button></div></section>
<section class="panel hidden" id="setup"><h1 id="setupTitle">Mestre</h1><p id="setupHint"></p><label for="nickname">Nome / Nick</label><input id="nickname" maxlength="24" placeholder="Digite seu nome" autocomplete="nickname"><div id="masterFields" class="hidden"><label for="roomName">Nome da sala</label><input id="roomName" maxlength="60" placeholder="Minha campanha"></div><div id="playerFields" class="hidden"><label for="roomCode">Código da sala</label><input id="roomCode" maxlength="8" placeholder="Código enviado pelo Mestre" style="text-transform:uppercase"></div><div class="actions"><button id="proceed">Continuar</button><button class="secondary" id="back">Voltar</button></div><div id="setupStatus" class="status hidden"></div></section>
<section class="panel hidden" id="lobby"><h1 id="hello">Sala</h1><div id="lobbyStatus" class="status"></div><div id="masterArea" class="hidden"><h3>Jogadores na sala</h3><div id="members"></div></div><div id="waitingArea" class="hidden"><h3>Aguardando o Mestre aprovar…</h3><p>Quando o Mestre liberar sua entrada, o botão aparecerá aqui.</p></div><div class="actions"><button id="enterMaster" type="button" style="display:none">Entrar no VTT</button><button id="enterPlayer" type="button" style="display:none">Entrar no VTT</button></div></section>
</main>
<script>
const $=id=>document.getElementById(id);let mode='',sb=null,user=null;
function showStatus(msg){const el=$('setupStatus');el.textContent=msg;el.classList.remove('hidden')}
function choose(which){mode=which;$('roles').classList.add('hidden');$('setup').classList.remove('hidden');$('masterFields').classList.toggle('hidden',which!=='master');$('playerFields').classList.toggle('hidden',which!=='player');$('setupTitle').textContent=which==='master'?'♛ Entrar como Mestre':'⚔ Entrar como Jogador';$('setupHint').textContent=which==='master'?'Digite seu nome e crie uma sala. Um código será gerado para compartilhar.':'Digite seu nome e o código da sala para entrar.';$('setupStatus').classList.add('hidden')}
$('asMaster').addEventListener('click',()=>choose('master'));$('asPlayer').addEventListener('click',()=>choose('player'));
$('back').addEventListener('click',()=>{$('setup').classList.add('hidden');$('roles').classList.remove('hidden')});
async function connect(){if(sb)return sb;const mod=await import('https://esm.sh/@supabase/supabase-js@2.57.0');sb=mod.createClient('https://dffaohrfdpzneaxrskka.supabase.co','sb_publishable_dezPrTyFioS7xTRPG4fFhA_tiIJDZwE');return sb}
async function getUser(nick){const client=await connect();let {data:{session},error}=await client.auth.getSession();if(error)throw error;if(!session){const r=await client.auth.signInAnonymously();if(r.error)throw new Error('Login anônimo: '+r.error.message);session=r.data.session}user=session.user;const r=await client.rpc('set_my_username',{p_username:nick});if(r.error)throw r.error}
async function openVtt(nick){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#101218;color:white;display:grid;place-items:center;z-index:99999;font:16px system-ui';o.textContent='Carregando sua mesa…';document.body.append(o);try{const r=await fetch('https://raw.githubusercontent.com/guifmartins1992-hub/mesa-vtt/main/mesa-vtt-v4.html.gz.b64',{cache:'no-store'});if(!r.ok)throw Error('Erro ao baixar VTT: '+r.status);const b=Uint8Array.from(atob((await r.text()).replace(/\s/g,'')),c=>c.charCodeAt(0));const page=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();const css='<style>html,body{background:#10131e!important;color:#e8e1cf!important;font-family:Courier New,monospace!important}button{border-radius:2px!important;border:2px solid #d3b36a!important;background:#74323a!important;color:#fff2ce!important}input,textarea,select{border:2px solid #82704c!important;background:#171a25!important;color:#f5e9ca!important}</style>';const np='<script>window.MESA_VTT_NICK='+JSON.stringify(nick)+';try{localStorage.setItem("mesa_vtt_nick",window.MESA_VTT_NICK)}catch(e){}<\/script>';document.open();document.write(page.replace('</head>',css+'</head>').replace('</body>',np+'</body>'));document.close()}catch(e){o.textContent='Falha ao abrir mesa: '+(e.message||e)}}
$('proceed').addEventListener('click',async()=>{$('proceed').disabled=true;try{const nick=$('nickname').value.trim();if(nick.length<2)throw Error('Digite seu nick (mínimo de 2 caracteres).');await getUser(nick);if(mode==='master'){const {data,error}=await sb.rpc('create_room',{p_name:$('roomName').value.trim()||'Minha mesa'});if(error)throw error;const row=Array.isArray(data)?data[0]:data;if(!row?.room_id||!row?.room_code)throw Error('Resposta inválida ao criar sala.');$('setup').classList.add('hidden');$('lobby').classList.remove('hidden');$('masterArea').classList.remove('hidden');$('hello').textContent=nick;$('lobbyStatus').innerHTML='Sala criada! Código para compartilhar:<br><span class="code"></span>';$('lobbyStatus').querySelector('.code').textContent=row.room_code;$('enterMaster').classList.remove('hidden');$('enterMaster').onclick=()=>openVtt(nick)}else{const code=$('roomCode').value.trim().toUpperCase();if(!code)throw Error('Digite o código da sala.');const {data,error}=await sb.rpc('join_room_with_code',{p_code:code});if(error)throw error;const room=Array.isArray(data)?data[0]:data;if(!room?.room_id)throw Error('Não foi possível entrar na sala pelo código.');$('setup').classList.add('hidden');$('lobby').classList.remove('hidden');$('hello').textContent=nick;$('lobbyStatus').textContent='Entrada confirmada. Abrindo o VTT…';openVtt(nick)}}catch(e){showStatus(e.message||String(e))}finally{$('proceed').disabled=false}});
</script></body></html>
