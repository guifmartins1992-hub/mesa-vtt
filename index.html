<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101218">
<title>Mesa VTT</title>
<style>
body{margin:0;background:#101218;color:#eee;font:16px system-ui;display:grid;place-items:center;min-height:100vh}
main{max-width:620px;padding:28px;text-align:center}
p{color:#aab3c2;line-height:1.6}
progress{width:min(340px,80vw);accent-color:#9b82ff}
code{color:#c9baff}
</style>
</head>
<body>
<main>
<h2>Carregando Mesa VTT…</h2>
<p>Preparando a versão V4. Mantenha esta página aberta.</p>
<progress></progress>
<p id="status">Baixando os arquivos do projeto…</p>
</main>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
  const url='https://raw.githubusercontent.com/guifmartins1992-hub/mesa-vtt/main/mesa-vtt-v4.html.gz.b64';
  const response=await fetch(url,{cache:'no-store'});
  if(!response.ok) throw new Error('Não foi possível baixar os arquivos ('+response.status+').');
  const encoded=(await response.text()).replace(/\s/g,'');
  const binary=atob(encoded);
  const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  if(!('DecompressionStream' in window)) throw new Error('Este navegador não oferece suporte à descompressão necessária. Atualize o navegador.');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  if(!html.toLowerCase().includes('<!doctype html')) throw new Error('O arquivo principal está incompleto.');
  document.open();document.write(html);document.close();
 }catch(error){
  status.textContent=error.message;
  const p=document.createElement('p');p.textContent='Tente atualizar a página. Se o erro continuar, avise para corrigirmos a publicação.';document.querySelector('main').appendChild(p);
 }
})();
</script>
</body>
</html>
