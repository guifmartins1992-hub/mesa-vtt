<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101218"><title>Mesa VTT</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#25223b,#101218 65%);color:#f4f1ff;font:16px system-ui;display:grid;place-items:center;padding:20px}main{width:min(100%,560px)}.panel{background:#191a25;border:1px solid #37364a;border-radius:18px;padding:26px;box-shadow:0 18px 60px #0008}h1{margin:0 0 6px;font-size:28px}h2{margin:18px 0 6px}p{color:#b9b5c9;line-height:1.5}label{display:block;margin:16px 0 7px;color:#d8d3e8;font-size:14px}input{width:100%;padding:13px;border:1px solid #49465e;border-radius:10px;background:#10111a;color:#fff;font:inherit}button{border:0;border-radius:10px;padding:13px 16px;background:#8d72e8;color:white;font-weight:700;font-size:15px;cursor:pointer}button.secondary{background:#353348}button.danger{background:#793d50}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.actions button{flex:1}.rolebtn{min-height:104px;font-size:19px}.hidden{display:none!important}.status{margin-top:16px;padding:12px;border-radius:10px;background:#252437;color:#d8d1f6;white-space:pre-wrap}.item{padding:12px;margin:8px 0;border:1px solid #3c394f;border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}.code{font:700 26px ui-monospace;letter-spacing:3px;color:#c7b6ff;display:inline-block;margin:8px 0}
</style></head><body><main>
<section class="panel" id="roles"><h1>⚔ Mesa VTT</h1><p>Como deseja acessar a mesa?</p><div class="actions"><button class="rolebtn" id="asMaster">♛ Mestre</button><button class="secondary rolebtn" id="asPlayer">⚔ Jogador</button></div></section>
<section class="panel hidden" id="setup"><h1 id="setupTitle">Mestre</h1><p id="setupHint"></p><label for="nickname">Nome / Nick</label><input id="nickname" maxlength="24" placeholder="Digite seu nome" autocomplete="nickname"><div id="masterFields" class="hidden"><label for="roomName">Nome da sala</label><input id="roomName" maxlength="60" placeholder="Minha campanha"></div><div id="playerFields" class="hidden"><label for="roomCode">Código da sala</label><input id="roomCode" maxlength="8" placeholder="Código enviado pelo Mestre" style="text-transform:uppercase"></div><div class="actions"><button id="proceed">Continuar</button><button class="secondary" id="back">Voltar</button></div><div id="setupStatus" class="status hidden"></div></section>
<section class="panel hidden" id="lobby"><h1 id="hello">Sala</h1><div id="lobbyStatus" class="status"></div><div id="masterArea" class="hidden"><h3>Jogadores na sala</h3><div id="members"></div></div><div id="waitingArea" class="hidden"><h3>Aguardando o Mestre aprovar…</h3><p>Quando o Mestre liberar sua entrada, o botão aparecerá aqui.</p></div><div class="actions"><button id="enterMaster" type="button" style="display:none">Entrar no VTT</button><button id="enterPlayer" type="button" style="display:none">Entrar no VTT</button></div></section>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const sb=createClient('https://dffaohrfdpzneaxrskka.supabase.co','sb_publishable_dezPrTyFioS7xTRPG4fFhA_tiIJDZwE');
const $=id=>document.getElementById(id);let mode='master',user=null,activeRoom=null,isMaster=false,entryOpen=true,watcher=null;
function status(id,msg){$(id).textContent=msg;$(id).classList.remove('hidden')}
function choose(which){mode=which;$('roles').classList.add('hidden');$('setup').classList.remove('hidden');$('masterFields').classList.toggle('hidden',which!=='master');$('playerFields').classList.toggle('hidden',which!=='player');$('setupTitle').textContent=which==='master'?'♛ Entrar como Mestre':'⚔ Entrar como Jogador';$('setupHint').textContent=which==='master'?'Digite seu nome e crie uma sala. Um código de convite será gerado para você compartilhar.':'Digite seu nome e o código da sala. Com o código correto, você entra diretamente.';$('setupStatus').classList.add('hidden')}
async function prepareUser(){const nick=$('nickname').value.trim();if(nick.length<2||nick.length>24)throw Error('Digite um nome entre 3 e 24 caracteres.');let {data:{session}}=await sb.auth.getSession();if(!session){const {data,error}=await sb.auth.signInAnonymously();if(error)throw Error('A sessão temporária não iniciou. O login anônimo precisa estar habilitado no Supabase. Detalhe: '+error.message);session=data.session}user=session.user;const {error}=await sb.rpc('set_my_username',{p_username:nick});if(error)throw error;$('hello').textContent=nick}
async function loadVTT(){const s=document.createElement('div');s.style.cssText='position:fixed;inset:0;background:#101218;color:white;display:grid;place-items:center;z-index:99999;font:16px system-ui';s.textContent='Carregando sua mesa…';document.body.append(s);try{const r=await fetch('https://raw.githubusercontent.com/guifmartins1992-hub/mesa-vtt/main/mesa-vtt-v4.html.gz.b64',{cache:'no-store'});if(!r.ok)throw Error('Falha ao baixar o VTT ('+r.status+')');const bin=atob((await r.text()).replace(/\s/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){s.textContent='Erro ao abrir o VTT: '+e.message}}
async function startMaster(room){activeRoom=room;isMaster=true;$('setup').classList.add('hidden');$('lobby').classList.remove('hidden');$('masterArea').classList.remove('hidden');$('waitingArea').classList.add('hidden');$('lobbyStatus').innerHTML='Sala criada! Código para convidar jogadores:<br><span class="code"></span><br>Qualquer pessoa com este código poderá entrar diretamente.';$('lobbyStatus').querySelector('.code').textContent=room.code;$('enterMaster').classList.remove('hidden');$('enterMaster').style.display='block'}
async function joinByCode(code){const {data,error}=await sb.rpc('join_room_with_code',{p_code:code});if(error)throw error;const room=Array.isArray(data)?data[0]:data;if(!room?.room_id)throw Error('Não foi possível entrar na sala.');activeRoom={id:room.room_id};$('setup').classList.add('hidden');$('lobby').classList.remove('hidden');$('masterArea').classList.add('hidden');$('waitingArea').classList.add('hidden');status('lobbyStatus','Você entrou na sala "'+room.room_name+'". Abrindo o VTT…');await loadVTT()}
$('asMaster').onclick=()=>choose('master');$('asPlayer').onclick=()=>choose('player');$('back').onclick=()=>{$('setup').classList.add('hidden');$('roles').classList.remove('hidden')};
$('proceed').onclick=async()=>{$('proceed').disabled=true;try{await prepareUser();if(mode==='master'){const {data,error}=await sb.rpc('create_room',{p_name:$('roomName').value.trim()||'Minha mesa'});if(error)throw error;const row=Array.isArray(data)?data[0]:data;await startMaster({id:row.room_id,code:row.room_code})}else{const code=$('roomCode').value.trim().toUpperCase();if(!code)throw Error('Digite o código da sala.');await joinByCode(code)}}catch(e){status('setupStatus',e.message||String(e))}finally{$('proceed').disabled=false}};

$('enterMaster').onclick=()=>loadVTT();$('enterPlayer').onclick=()=>loadVTT();
</script></body></html>
